<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — IPJC · Igreja Presbiteriana em Jardim Camburi</title>
  <meta name="description" content="Textos, reflexões e devocionais da Igreja Presbiteriana em Jardim Camburi.">
  <meta name="theme-color" content="#F2EDE4">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog — IPJC · Igreja Presbiteriana em Jardim Camburi">
  <meta property="og:description" content="Textos, reflexões e devocionais da Igreja Presbiteriana em Jardim Camburi.">
  <meta property="og:image" content="https://www.ipjc.org.br/assets/img/og-ipjc.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="IPJC — Igreja Presbiteriana em Jardim Camburi">
  <link rel="icon" href="assets/img/logo/ipjc-simbolo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Poppins:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/blog.css">

  <script>document.documentElement.classList.add('js')</script>
  <script src="js/conteudo.js" defer></script>
  <script src="js/dados.js" defer></script>
  <script src="js/site.js" defer></script>
  <script src="js/blog.js" defer></script>
</head>
<body data-page="blog">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="site-header"></div>

  <main id="conteudo">

    <section class="page-hero" aria-labelledby="blog-titulo">
      <div class="calcadao" aria-hidden="true"></div>
      <div class="container">
        <p class="eyebrow reveal">Blog</p>
        <h1 class="reveal" id="blog-titulo">Palavras para<br> <span class="script nowrap">o caminho</span></h1>
        <p class="page-lead reveal">Textos, reflexões e devocionais para acompanhar você ao longo da semana.</p>
      </div>
    </section>

    <section class="section--tight blog-destaque-sec" id="blog-destaque-sec" aria-label="Texto mais recente" hidden>
      <div class="container" id="blog-destaque"></div>
    </section>

    <section class="section" aria-labelledby="todos-titulo">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow reveal">Arquivo</p>
            <h2 class="reveal" id="todos-titulo">Todos os textos</h2>
          </div>
          <label class="busca reveal" for="blog-busca">
            <span class="visually-hidden">Buscar textos</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="blog-busca" placeholder="Buscar por título, autor ou tema" autocomplete="off">
          </label>
        </div>
        <div class="filtros reveal" role="group" aria-label="Filtrar por tema" id="blog-tags"></div>
        <p class="visually-hidden" aria-live="polite" id="blog-status"></p>
        <div class="posts-grid" id="blog-lista"></div>
        <div class="blog-mais"><button class="btn btn--ghost" type="button" id="blog-mais" hidden>Carregar mais textos</button></div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
</body>
</html>
